<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konkan Railway - Leave Web Portal</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .krcl-header {
            background-color: #ffffff;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border-bottom: 2px solid #0056b3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        /* Konkan Railway Big Size Logo */
        .krcl-logo-img {
            height: 90px;
            width: auto;
            object-fit: contain;
        }

        /* Portal Name Strip */
        .portal-strip {
            background-color: #e8eef7;
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #d0dbe8;
        }

        .portal-strip h1 {
            font-size: 22px;
            color: #1a2b4c;
            font-weight: bold;
        }

        /* Main Section with Scenic Railway Background */
        .main-content {
            flex: 1;
            background: linear-gradient(rgba(0, 0, 0, 0.3), rgba(0, 0, 0, 0.3)), 
                        url('https://images.unsplash.com/photo-1541872703-74c5e44368f9?q=80&w=1600') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Login Card */
        .login-card {
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 35px;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
        }

        .login-card h3 {
            color: #1a2b4c;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box input {
            width: 100%;
            padding: 10px 40px 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        .input-box input:focus {
            border-color: #0056b3;
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.3);
        }

        .input-box i {
            position: absolute;
            right: 12px;
            color: #666;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background-color: #1a2b4c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 12px;
            font-size: 13px;
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Footer Bar */
        .krcl-footer {
            background-color: #e8eef7;
            text-align: center;
            padding: 12px;
            font-size: 13px;
            color: #333;
            border-top: 1px solid #d0dbe8;
        }

        /* Forgot Password Modal Box */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 15px; top: 10px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Section with BIG LOGO Only -->
    <header class="krcl-header">
        <img src="https://upload.wikimedia.org/wikipedia/en/2/23/Konkan_Railway_logo.png" 
             alt="Konkan Railway Logo" class="krcl-logo-img">
    </header>

    <!-- Portal Strip -->
    <div class="portal-strip">
        <h1>लीव्ह वेब पोर्टल / Leave Web Portal</h1>
    </div>

    <!-- Background Section with Login Card -->
    <main class="main-content">
        <div class="login-card">
            <h3>Login to Portal</h3>
            
            <form method="POST" action="/">
                <div class="form-group">
                    <label>Login ID / Employee ID *</label>
                    <div class="input-box">
                        <input type="text" name="user_id" placeholder="Enter Employee Id" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password *</label>
                    <div class="input-box">
                        <input type="password" id="pwdInput" name="password" placeholder="Enter Password" required>
                        <i class="fa-solid fa-lock" id="pwdIcon" onclick="togglePassword()"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Sign-In</button>

                <a class="forgot-link" onclick="openForgotModal()">Forgot Password? Click Here..</a>
            </form>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeForgotModal()">&times;</span>
            <h3 style="margin-bottom: 15px; color: #1a2b4c;">Get Password via Text SMS</h3>
            <form method="POST" action="/forgot_password">
                <div class="form-group">
                    <label>User ID / Employee ID</label>
                    <input type="text" name="user_id" placeholder="Enter User ID" required style="width:100%; padding:8px; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>Registered Mobile No</label>
                    <input type="tel" name="mobile_no" placeholder="Enter 10 digit Mobile No" pattern="[0-9]{10}" required style="width:100%; padding:8px; margin-top:5px;">
                </div>
                <button type="submit" class="btn-submit">Send Password via Text SMS</button>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="krcl-footer">
        © Konkan Railway Corporation Ltd. (A Government of India Undertaking). All rights reserved.
    </footer>

    <script>
        function togglePassword() {
            const pwdInput = document.getElementById('pwdInput');
            const pwdIcon = document.getElementById('pwdIcon');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.classList.remove('fa-lock');
                pwdIcon.classList.add('fa-lock-open');
                pwdIcon.style.color = '#0056b3';
            } else {
                pwdInput.type = 'password';
                pwdIcon.classList.remove('fa-lock-open');
                pwdIcon.classList.add('fa-lock');
                pwdIcon.style.color = '#666';
            }
        }

        function openForgotModal() { document.getElementById('forgotModal').style.display = 'flex'; }
        function closeForgotModal() { document.getElementById('forgotModal').style.display = 'none'; }
    </script>

</body>
</html>
