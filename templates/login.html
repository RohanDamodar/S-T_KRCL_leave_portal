<!DOCTYPE html>
<html>
<head>
    <title>Leave Portal - Login</title>
    <style>
        body { font-family: Arial, sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background-color: #f4f4f9; }
        .login-box { background: white; padding: 25px; border-radius: 8px; box-shadow: 0px 0px 10px #ccc; width: 300px; }
        input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Leave Application Portal</h2>
        <form method="POST">
            <input type="text" name="user_id" placeholder="Unique User ID (eg: EMP101)" required>
            <input type="password" name="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
