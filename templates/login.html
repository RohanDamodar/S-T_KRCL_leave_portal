<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konkan Railway - Leave Web Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, Helvetica, sans-serif; }
        body { background-color: #f4f6f9; display: flex; flex-direction: column; min-height: 100vh; }
        
        .krcl-header { 
            background-color: #ffffff; 
            padding: 15px 35px; 
            display: flex; 
            align-items: center; 
            border-bottom: 2px solid #0056b3; 
            box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
        }
        .logo-section { display: flex; align-items: center; gap: 25px; }
        
        .krcl-logo-img { 
            height: 140px; 
            width: auto; 
            object-fit: contain; 
        }
        
        .company-title h2 { font-size: 26px; color: #032B69; font-weight: 900; margin-bottom: 3px; }
        .company-title h4 { font-size: 15px; color: #222; font-weight: bold; margin-bottom: 3px; }
        .company-title h3 { font-size: 22px; color: #032B69; font-weight: 800; margin-bottom: 3px; }
        .company-title p { font-size: 14px; color: #333; font-weight: bold; }

        .portal-strip { background-color: #e8eef7; text-align: center; padding: 10px; border-bottom: 1px solid #d0dbe8; }
        .portal-strip h1 { font-size: 22px; color: #1a2b4c; font-weight: bold; }

        .main-content {
            flex: 1;
            background: linear-gradient(rgba(0, 0, 0, 0.15), rgba(0, 0, 0, 0.15)), 
                        url("{{ url_for('static', filename='bg.jpg') }}") no-repeat center center;
            background-size: cover;
            display: flex; justify-content: center; align-items: center; padding: 40px 20px;
        }

        .login-card { background: rgba(255, 255, 255, 0.94); padding: 30px 35px; border-radius: 8px; width: 100%; max-width: 420px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4); backdrop-filter: blur(4px); }
        .login-card h3 { color: #1a2b4c; text-align: center; margin-bottom: 20px; font-size: 22px; border-bottom: 2px solid #0056b3; padding-bottom: 8px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 14px; font-weight: bold; color: #333; margin-bottom: 6px; }
        .input-box { position: relative; display: flex; align-items: center; }
        .input-box input { width: 100%; padding: 10px 40px 10px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 14px; outline: none; background: #fff; }
        .input-box i { position: absolute; right: 12px; color: #666; cursor: pointer; }
        
        .btn-submit { width: 100%; background-color: #1a2b4c; color: white; border: none; padding: 12px; border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .btn-submit:hover { background-color: #0056b3; }
        .forgot-link { display: block; text-align: right; margin-top: 12px; font-size: 13px; color: #0056b3; font-weight: bold; cursor: pointer; }
        .krcl-footer { background-color: #e8eef7; text-align: center; padding: 12px; font-size: 13px; color: #333; border-top: 1px solid #d0dbe8; }
    </style>
</head>
<body>

    <header class="krcl-header">
        <div class="logo-section">
            <img src="{{ url_for('static', filename='logo.png') }}" alt="Konkan Railway Logo" class="krcl-logo-img">
            <div class="company-title">
                <h2>कोंकण रेलवे कॉर्पोरेशन लिमिटेड</h2>
                <h4>(भारत सरकार का उपक्रम)</h4>
                <h3>Konkan Railway Corporation Limited</h3>
                <p>(A Govt. Of India Undertaking)</p>
            </div>
        </div>
    </header>

    <div class="portal-strip">
        <h1>लीव्ह वेब पोर्टल / Leave Web Portal</h1>
    </div>

    <main class="main-content">
        <div class="login-card">
            <h3>Login to Portal</h3>
            <form method="POST" action="/">
                <div class="form-group">
                    <label>Login ID / Employee ID *</label>
                    <div class="input-box">
                        <input type="text" name="user_id" placeholder="Enter Employee Id" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>
                <div class="form-group">
                    <label>Password *</label>
                    <div class="input-box">
                        <input type="password" id="pwdInput" name="password" placeholder="Enter Password" required>
                        <i class="fa-solid fa-lock" id="pwdIcon" onclick="togglePassword()"></i>
                    </div>
                </div>
                <button type="submit" class="btn-submit">Sign-In</button>
                <a class="forgot-link" onclick="alert('पासवर्ड रिसेट करण्यासाठी कृपया आपल्या S&T Admin शी संपर्क साधा.');">Forgot Password? Click Here..</a>
            </form>
        </div>
    </main>

    <footer class="krcl-footer">
        © Konkan Railway Corporation Ltd. (A Government of India Undertaking). All rights reserved.
    </footer>

    <script>
        function togglePassword() {
            const pwdInput = document.getElementById('pwdInput');
            const pwdIcon = document.getElementById('pwdIcon');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.classList.remove('fa-lock');
                pwdIcon.classList.add('fa-lock-open');
            } else {
                pwdInput.type = 'password';
                pwdIcon.classList.remove('fa-lock-open');
                pwdIcon.classList.add('fa-lock');
            }
        }
    </script>
</body>
</html>
