<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konkan Railway - Leave Web Portal</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background-color: #f4f6f9;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header Bar */
        .krcl-header {
            background-color: #ffffff;
            padding: 12px 30px;
            display: flex;
            align-items: center;
            border-bottom: 2px solid #0056b3;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
        }

        /* SVG Direct Vector Logo (100% Guaranteed Display) */
        .krcl-svg-logo {
            height: 85px;
            width: auto;
        }

        /* Portal Name Strip */
        .portal-strip {
            background-color: #e8eef7;
            text-align: center;
            padding: 10px;
            border-bottom: 1px solid #d0dbe8;
        }

        .portal-strip h1 {
            font-size: 22px;
            color: #1a2b4c;
            font-weight: bold;
        }

        /* Main Section with Konkan Railway Bridge Scenic Background */
        .main-content {
            flex: 1;
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), 
                        url('https://images.unsplash.com/photo-1541872703-74c5e44368f9?q=80&w=1600') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        /* Login Floating Card */
        .login-card {
            background: rgba(255, 255, 255, 0.92);
            padding: 30px 35px;
            border-radius: 8px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
        }

        .login-card h3 {
            color: #1a2b4c;
            text-align: center;
            margin-bottom: 20px;
            font-size: 22px;
            border-bottom: 2px solid #0056b3;
            padding-bottom: 8px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 14px;
            font-weight: bold;
            color: #333;
            margin-bottom: 6px;
        }

        .input-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-box input {
            width: 100%;
            padding: 10px 40px 10px 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
            background-color: #fff;
        }

        .input-box input:focus {
            border-color: #0056b3;
            box-shadow: 0 0 5px rgba(0, 86, 179, 0.3);
        }

        .input-box i {
            position: absolute;
            right: 12px;
            color: #666;
            cursor: pointer;
        }

        .btn-submit {
            width: 100%;
            background-color: #1a2b4c;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .forgot-link {
            display: block;
            text-align: right;
            margin-top: 12px;
            font-size: 13px;
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
            cursor: pointer;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        /* Footer Bar */
        .krcl-footer {
            background-color: #e8eef7;
            text-align: center;
            padding: 12px;
            font-size: 13px;
            color: #333;
            border-top: 1px solid #d0dbe8;
        }

        /* Forgot Password Modal Box */
        .modal {
            display: none;
            position: fixed;
            z-index: 10;
            left: 0; top: 0;
            width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 8px;
            width: 350px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            right: 15px; top: 10px;
            font-size: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Header Section (KRCL Emblem Logo Vector) -->
    <header class="krcl-header">
        <div class="logo-container">
            <svg class="krcl-svg-logo" viewBox="0 0 320 80" xmlns="http://www.w3.org/2000/svg">
                <!-- Circular KR Emblem -->
                <circle cx="40" cy="40" r="35" fill="#003366" stroke="#DAA520" stroke-width="3"/>
                <circle cx="40" cy="40" r="28" fill="none" stroke="#FFFFFF" stroke-width="2"/>
                <text x="40" y="32" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#DAA520" text-anchor="middle">कोंकण रेल</text>
                <text x="40" y="52" font-family="Arial, sans-serif" font-size="22" font-weight="900" fill="#FFFFFF" text-anchor="middle">KR</text>
                <path d="M18 58 Q40 64 62 58" fill="none" stroke="#DAA520" stroke-width="2"/>
                <text x="40" y="68" font-family="Arial, sans-serif" font-size="8" font-weight="bold" fill="#FFFFFF" text-anchor="middle">सादर सेवा</text>

                <!-- Text Header -->
                <text x="90" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#003366">कोंकण रेलवे कॉर्पोरेशन लिमिटेड</text>
                <text x="90" y="55" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#555555">(भारत सरकार का उपक्रम) / Konkan Railway Corp. Ltd.</text>
            </svg>
        </div>
    </header>

    <!-- Portal Strip -->
    <div class="portal-strip">
        <h1>लीव्ह वेब पोर्टल / Leave Web Portal</h1>
    </div>

    <!-- Main Content Background -->
    <main class="main-content">
        <div class="login-card">
            <h3>Login to Portal</h3>
            
            <form method="POST" action="/">
                <div class="form-group">
                    <label>Login ID / Employee ID *</label>
                    <div class="input-box">
                        <input type="text" name="user_id" placeholder="Enter Employee Id" required>
                        <i class="fa-solid fa-user"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password *</label>
                    <div class="input-box">
                        <input type="password" id="pwdInput" name="password" placeholder="Enter Password" required>
                        <i class="fa-solid fa-lock" id="pwdIcon" onclick="togglePassword()"></i>
                    </div>
                </div>

                <button type="submit" class="btn-submit">Sign-In</button>

                <a class="forgot-link" onclick="openForgotModal()">Forgot Password? Click Here..</a>
            </form>
        </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgotModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeForgotModal()">&times;</span>
            <h3 style="margin-bottom: 15px; color: #1a2b4c;">Get Password via Text SMS</h3>
            <form method="POST" action="/forgot_password">
                <div class="form-group">
                    <label>User ID / Employee ID</label>
                    <input type="text" name="user_id" placeholder="Enter User ID" required style="width:100%; padding:8px; margin-top:5px;">
                </div>
                <div class="form-group">
                    <label>Registered Mobile No</label>
                    <input type="tel" name="mobile_no" placeholder="Enter 10 digit Mobile No" pattern="[0-9]{10}" required style="width:100%; padding:8px; margin-top:5px;">
                </div>
                <button type="submit" class="btn-submit">Send Password via Text SMS</button>
            </form>
        </div>
    </div>

    <!-- Footer Bar -->
    <footer class="krcl-footer">
        © Konkan Railway Corporation Ltd. (A Government of India Undertaking). All rights reserved.
    </footer>

    <script>
        function togglePassword() {
            const pwdInput = document.getElementById('pwdInput');
            const pwdIcon = document.getElementById('pwdIcon');

            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                pwdIcon.classList.remove('fa-lock');
                pwdIcon.classList.add('fa-lock-open');
                pwdIcon.style.color = '#0056b3';
            } else {
                pwdInput.type = 'password';
                pwdIcon.classList.remove('fa-lock-open');
                pwdIcon.classList.add('fa-lock');
                pwdIcon.style.color = '#666';
            }
        }

        function openForgotModal() { document.getElementById('forgotModal').style.display = 'flex'; }
        function closeForgotModal() { document.getElementById('forgotModal').style.display = 'none'; }
    </script>

</body>
</html>
