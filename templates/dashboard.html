<!DOCTYPE html>
<html>
<head>
    <title>Employee Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; }
        .balance-card { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { background: #f4f4f4; padding: 15px; border-radius: 8px; width: 150px; text-align: center; border: 1px solid #ccc; }
        .card h3 { margin: 0; font-size: 24px; color: #007bff; }
        form { background: #fafafa; padding: 20px; border-radius: 8px; border: 1px solid #ddd; width: 350px; }
        input, select, textarea, button { width: 100%; margin-top: 10px; padding: 8px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
    </style>
</head>
<body>
    <h2>Welcome, {{ name }}</h2>
    <a href="/logout">Logout</a>

    <h3>Your Leave Balance</h3>
    <div class="balance-card">
        <div class="card">
            <p>EL Balance</p>
            <h3>{{ balances[0] }}</h3>
        </div>
        <div class="card">
            <p>CL Balance</p>
            <h3>{{ balances[1] }}</h3>
        </div>
    </div>

    <h3>Apply for Leave</h3>
    <form method="POST">
        <label>Leave Type:</label>
        <select name="leave_type" required>
            <option value="EL">EL (Earned Leave)</option>
            <option value="CL">CL (Casual Leave)</option>
        </select>

        <label>Start Date:</label>
        <input type="date" name="start_date" required>

        <label>End Date:</label>
        <input type="date" name="end_date" required>

        <label>Reason:</label>
        <textarea name="reason" rows="3" placeholder="Enter reason..." required></textarea>

        <button type="submit">Submit Application</button>
    </form>

    <h3>My Leave Applications</h3>
    <table>
        <tr>
            <th>Type</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Reason</th>
            <th>Status</th>
        </tr>
        {% for req in requests %}
        <tr>
            <td><b>{{ req[0] }}</b></td>
            <td>{{ req[1] }}</td>
            <td>{{ req[2] }}</td>
            <td>{{ req[3] }}</td>
            <td><b>{{ req[4] }}</b></td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
